<div class="pagina">

  <header class="capçalera">
    <div class="titol-wrap">
      <h2>{{ ts.t('repartiment_titol') }}</h2>
      <p class="subtitol">{{ ts.t('repartiment_subtitol') }}</p>
    </div>
    <div class="progres-badge">
      <span class="progres-num">{{ haVistos() }}</span>
      <span class="progres-sep">/</span>
      <span class="progres-total">{{ total() }}</span>
    </div>
  </header>

  <div class="jugadors-llista">
    @for (jugador of jugadors(); track jugador.nom) {
      <button
        class="jugador-btn"
        [class.vist]="jugador.haVist"
        (click)="obrirPopup(jugador)"
        [disabled]="jugador.haVist"
      >
        <span class="jugador-nom">{{ jugador.nom }}</span>
        @if (jugador.haVist) {
          <span class="badge-vist">✓</span>
        } @else {
          <span class="badge-pendent">{{ ts.t('toca_revelar') }}</span>
        }
      </button>
    }
  </div>

  @if (totHanVist()) {
    <div class="tots-llestos">
      <span class="llestos-icon">✓</span>
      {{ ts.t('tots_llestos') }}
    </div>
  }

</div>

@if (jugadorActiu()) {
  <app-popup-rol
    [jugador]="jugadorActiu()!"
    [potCanviar]="potCanviarActual()"
    [canvisRestants]="canvisRestantsActuals()"
    (tancar)="tancarPopup()"
    (canviarParaulaClick)="onCanviarParaula()"
  />
}
