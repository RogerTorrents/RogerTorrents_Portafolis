<div class="foto-jugador" [class]="'mida-' + mida()">
  @if (!senseFoto()) {
    <img [src]="src()" [alt]="nom()" loading="lazy" (error)="onError()" />
  } @else {
    <div class="avatar-reserva" aria-hidden="true">
      <span [style.color]="degradat()[0]">{{ inicials() }}</span>
    </div>
  }
</div>
