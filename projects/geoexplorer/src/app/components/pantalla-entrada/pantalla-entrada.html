<div class="geo-entrada">
  <svg class="geo-entrada-contorns" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <ellipse class="geo-contorn" cx="920" cy="170" rx="110" ry="88" transform="rotate(-8 920 170)" />
    <ellipse class="geo-contorn" cx="920" cy="170" rx="195" ry="158" transform="rotate(-8 920 170)" />
    <ellipse class="geo-contorn" cx="920" cy="170" rx="285" ry="232" transform="rotate(-8 920 170)" />
    <ellipse class="geo-contorn" cx="920" cy="170" rx="375" ry="308" transform="rotate(-8 920 170)" />
    <text class="geo-contorn-cota" x="1145" y="170">2.400</text>
    <ellipse class="geo-contorn geo-contorn--alt" cx="200" cy="660" rx="130" ry="96" transform="rotate(12 200 660)" />
    <ellipse class="geo-contorn geo-contorn--alt" cx="200" cy="660" rx="220" ry="164" transform="rotate(12 200 660)" />
    <ellipse class="geo-contorn geo-contorn--alt" cx="200" cy="660" rx="310" ry="234" transform="rotate(12 200 660)" />
    <text class="geo-contorn-cota geo-contorn-cota--alt" x="20" y="410">1.100</text>
  </svg>

  <svg class="geo-entrada-traça" viewBox="0 0 900 260" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="geoTraçaGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#6ba86f" />
        <stop offset="45%" stop-color="#d1a13c" />
        <stop offset="100%" stop-color="#e8622f" />
      </linearGradient>
    </defs>
    <path
      #traçaLinia
      class="geo-traça-linia"
      d="M -20 190 C 120 150, 180 220, 280 170 S 420 60, 520 100 S 660 200, 760 120 S 880 40, 940 70"
      fill="none"
      pathLength="1"
    />
    <rect #traçaFita class="geo-traça-fita" x="932" y="60" width="14" height="14" rx="2" transform="rotate(45 939 67)" />
  </svg>

  <main class="geo-entrada-contingut">
    <div class="geo-entrada-marca">
      <p class="geo-entrada-eyebrow">{{ ts.t('entrada_eyebrow') }}</p>
      <div class="geo-entrada-wordmark">
        <svg class="geo-entrada-simbol" viewBox="0 0 32 32" aria-hidden="true">
          <path class="geo-marca-cim" d="M3 23.5 L12.5 8.5 L16.5 15 L20.5 7.5 L29 23.5 Z" />
          <path class="geo-marca-corba" d="M1.5 26.5 Q16 22.5 30.5 26.5" />
          <path class="geo-marca-corba geo-marca-corba--2" d="M4.5 29.5 Q16 26.5 27.5 29.5" />
        </svg>
        <h1>{{ ts.t('entrada_titol') }}</h1>
      </div>
    </div>
    <p class="geo-entrada-subtitol">{{ ts.t('entrada_subtitol') }}</p>

    <div class="geo-entrada-opcions">
      <button type="button" class="geo-opcio geo-opcio--primaria" (click)="sessio.entrarComConvidat()">
        <span class="geo-opcio-titol">{{ ts.t('entrada_convidat') }}</span>
        <span class="geo-opcio-desc">{{ ts.t('entrada_convidat_desc') }}</span>
      </button>

      <div class="geo-entrada-secundaries">
        <button type="button" class="geo-opcio geo-opcio--secundaria" (click)="sessio.anarA('login')">
          <span class="geo-opcio-titol">{{ ts.t('entrada_login') }}</span>
          <span class="geo-opcio-desc">{{ ts.t('entrada_login_desc') }}</span>
        </button>
        <button type="button" class="geo-opcio geo-opcio--secundaria" (click)="sessio.anarA('registre')">
          <span class="geo-opcio-titol">{{ ts.t('entrada_registre') }}</span>
          <span class="geo-opcio-desc">{{ ts.t('entrada_registre_desc') }}</span>
        </button>
      </div>

      <p class="geo-entrada-nota">{{ ts.t('entrada_compte_compartit') }}</p>
    </div>
  </main>
</div>
