<div #contenidorMapa class="geo-mapa"></div>

@if (dispositiu.tactil()) {
  <button
    type="button"
    class="geo-boto-ubicacio"
    [class.geo-boto-ubicacio--actiu]="localitzant()"
    [attr.aria-label]="ts.t('ubicacio_boto')"
    [title]="ts.t('ubicacio_boto')"
    (click)="ubicar()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke-linecap="round" />
      <circle cx="12" cy="12" r="7.5" class="geo-boto-ubicacio-anell" />
    </svg>
  </button>
  @if (errorUbicacio()) {
    <p class="geo-ubicacio-error" role="alert">{{ ts.t('ubicacio_error') }}</p>
  }
}
